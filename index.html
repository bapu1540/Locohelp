<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LOCOHELP</title>
    <meta name="description" content="A hyper-local, real-time urgent task network." />
    <meta property="og:title" content="LOCOHELP" />
    <meta property="og:description" content="A hyper-local, real-time urgent task network." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="google-signin-client_id" content="547738120834-43c97ifmhguemiqcp2b8lgllffqf55p1.apps.googleusercontent.com" />

    <!-- Default Light Background to Prevent Any Black Screen or Flash -->
    <style>
      html, body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        overflow-x: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>

    <!-- Clean up any stale service workers & caches -->
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var r of registrations) {
              r.unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
            }
          }).catch(function() {});
        }
      } catch (e) {}

      // Fail-safe Global Exception Handler: Automatically renders Recovery UI
      function renderFailSafeRecovery() {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;text-align:center;padding:20px;">' +
            '<div style="max-width:380px;background:#ffffff;padding:28px;border-radius:24px;border:1px solid #e2e8f0;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">' +
              '<div style="font-size:36px;margin-bottom:12px;">⚡</div>' +
              '<h3 style="font-size:20px;font-weight:900;color:#0f172a;margin:0 0 8px 0;letter-spacing:-0.5px;">LOCOHELP</h3>' +
              '<p style="font-size:13px;color:#64748b;margin:0 0 20px 0;line-height:1.5;">Neighborhood network ready. Tap below to refresh session.</p>' +
              '<button onclick="try{localStorage.clear();}catch(e){} location.reload();" style="width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 10px 15px -3px rgba(37,99,235,0.3);">' +
                '🔄 Refresh & Reload App' +
              '</button>' +
            '</div>' +
          '</div>';
        }
      }

      window.addEventListener('error', function(e) {
        console.error("Global JS Error Captured:", e.error || e.message);
        renderFailSafeRecovery();
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.warn("Global Promise Rejection Captured:", e.reason);
      });
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
