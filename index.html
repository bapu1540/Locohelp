    <!-- Default Light Background to Prevent Any Black Screen or Flash -->
    <style>
      html, body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;

      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: hidden !important;
      }
    </style>

    <!-- Capture PWA Install Prompt early & register Service Worker (/sw.js) -->
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('locohelp-pwa-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('locohelp-pwa-installed'));
      });
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) {
              if (k !== 'locohelp-pwa-v8') {
                caches.delete(k);
              }
            });
          }).catch(function() {});
        }
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            fetch('/sw.js', { cache: 'no-store' })
              .then(function(res) {
                var ct = (res && res.headers && res.headers.get('content-type')) || '';
                if (res && res.ok && ct.indexOf('javascript') !== -1) {
                  return navigator.serviceWorker.register('/sw.js', { scope: '/' });
                }
              })
              .catch(function() {
                // Silently ignore transient network / proxy errors during SW check
              });
          });
        }
      } catch (e) {}

      // Fail-safe Global Exception Handler: Automatically renders Recovery UI only if root failed to mount
      function renderFailSafeRecovery() {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0 || root.getAttribute('data-booting') === 'true')) {
          root.removeAttribute('data-booting');
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;text-align:center;padding:20px;">' +
            '<div style="max-width:380px;background:#ffffff;padding:28px;border-radius:24px;border:1px solid #e2e8f0;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">' +
              '<div style="display:flex;justify-content:center;margin-bottom:12px;">' +
                '<svg width="56" height="56" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                  '<path d="M 16 60 C 26 84, 42 93, 50 93 C 58 93, 74 84, 84 60 C 87 53, 77 49, 73 55 C 65 67, 57 76, 50 76 C 43 76, 35 67, 27 55 C 23 49, 13 53, 16 60 Z" fill="#FF8800" stroke="#FF8800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />' +
                  '<path d="M 50 6 C 36 6 25 17 25 31 C 25 46 50 66 50 66 C 50 66 75 46 75 31 C 75 17 64 6 50 6 Z M 50 42 C 43.9 42 39 37.1 39 31 C 39 24.9 43.9 20 50 20 C 56.1 20 61 24.9 61 31 C 61 37.1 56.1 42 50 42 Z" fill="#0066FF" />' +
                '</svg>' +
              '</div>' +
              '<h3 style="font-size:24px;font-weight:900;margin:0 0 8px 0;letter-spacing:-0.5px;"><span style="color:#0066FF;">Loco</span><span style="color:#FF8800;">Help</span></h3>' +
              '<p style="font-size:13px;color:#64748b;margin:0 0 20px 0;line-height:1.5;">Neighborhood network ready. Tap below to refresh session.</p>' +
              '<button onclick="try{if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}}catch(e){} location.reload();" style="width:100%;padding:14px;background:#0066FF;color:#fff;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 10px 15px -3px rgba(0,102,255,0.3);">' +
                '🔄 Refresh & Reload App' +
              '</button>' +
            '</div>' +
          '</div>';
        }
      }

      window.addEventListener('error', function(e) {
        var msg = String((e && (e.message || (e.error && e.error.message))) || '');
        if (msg.indexOf('ServiceWorker') !== -1 || msg.indexOf('sw.js') !== -1) {
          e.preventDefault();
          return;
        }
        setTimeout(renderFailSafeRecovery, 200);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = String((e && e.reason && (e.reason.message || e.reason)) || '');
        if (reasonStr.indexOf('ServiceWorker') !== -1 || reasonStr.indexOf('sw.js') !== -1) {
          e.preventDefault();
          return;
        }
      });
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <!-- Animated PWA Startup Splash Screen (Official LocoHelp Logo & Brand Typography) -->
    <div id="pwa-startup-splash" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);color:#0f172a;font-family:system-ui,-apple-system,sans-serif;pointer-events:none;transition:opacity 0.5s ease-out, visibility 0.5s ease-out;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;">
        <!-- Glowing animated pulse rings in LocoHelp Blue & Orange -->
        <div style="position:absolute;width:136px;height:136px;border-radius:50%;background:rgba(0,102,255,0.16);animation:splashPulseRing 1.8s infinite cubic-bezier(0.4,0,0.6,1);"></div>
        <div style="position:absolute;width:176px;height:176px;border-radius:50%;background:rgba(255,136,0,0.14);animation:splashPulseRing 1.8s infinite cubic-bezier(0.4,0,0.6,1) 0.4s;"></div>
        
        <!-- Official LocoHelp Logo container with smooth zoom + fade in -->
        <div style="position:relative;z-index:10;width:98px;height:98px;border-radius:30px;background:#ffffff;border:2px solid #e2e8f0;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 45px -10px rgba(0,102,255,0.28);animation:splashZoomIn 1.1s cubic-bezier(0.16,1,0.3,1) forwards;">
          <svg width="74" height="74" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M 16 60 C 26 84, 42 93, 50 93 C 58 93, 74 84, 84 60 C 87 53, 77 49, 73 55 C 65 67, 57 76, 50 76 C 43 76, 35 67, 27 55 C 23 49, 13 53, 16 60 Z"
              fill="#FF8800"
              stroke="#FF8800"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M 50 6 C 36 6 25 17 25 31 C 25 46 50 66 50 66 C 50 66 75 46 75 31 C 75 17 64 6 50 6 Z M 50 42 C 43.9 42 39 37.1 39 31 C 39 24.9 43.9 20 50 20 C 56.1 20 61 24.9 61 31 C 61 37.1 56.1 42 50 42 Z"
              fill="#0066FF"
            />
          </svg>
        </div>
      </div>
      <div style="margin-top:26px;text-align:center;animation:splashFadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.15s;opacity:0;">
        <h1 style="font-size:34px;font-weight:900;letter-spacing:-0.8px;margin:0;line-height:1;">
          <span style="color:#0066FF;">Loco</span><span style="color:#FF8800;">Help</span>
        </h1>
        <p style="font-size:12px;font-weight:800;color:#475569;margin:8px 0 0 0;letter-spacing:1.6px;text-transform:uppercase;">Hyper-Local Help Network</p>
      </div>
    </div>

    <style>
      @keyframes splashZoomIn {
        0% { transform: scale(0.4); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splashPulseRing {
        0% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
        100% { transform: scale(0.85); opacity: 0.8; }
      }
      @keyframes splashFadeUp {
        0% { transform: translateY(14px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
    </style>

    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('pwa-startup-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 500);
          }
        }, 1200);
      });
    </script>

    <div id="root" data-booting="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
