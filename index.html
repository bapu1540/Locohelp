  <head>

    <script>
      if (!window.__LOCOHELP_GA_INITIALIZED__) {
        window.__LOCOHELP_GA_INITIALIZED__ = true;
        window.dataLayer = window.dataLayer || [];
        function gtag(){window.dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-ZN184GR1M9', {

        });

    <!-- Default Light Background to Prevent Any Black Screen or Flash -->
    <style>
      html, body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: hidden !important;
      }
    </style>

    <!-- Capture PWA Install Prompt early & register Service Worker (/sw.js) -->
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('locohelp-pwa-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('locohelp-pwa-installed'));
      });
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) {
              if (k !== 'locohelp-pwa-v6') {
                caches.delete(k);
              }
            });
          }).catch(function() {});
        }
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            fetch('/sw.js', { cache: 'no-store' })
              .then(function(res) {
                var ct = (res && res.headers && res.headers.get('content-type')) || '';
                if (res && res.ok && ct.indexOf('javascript') !== -1) {
                  return navigator.serviceWorker.register('/sw.js', { scope: '/' });
                }
              })
              .catch(function() {
                // Silently ignore transient network / proxy errors during SW check
              });
          });
        }
      } catch (e) {}

      // Fail-safe Global Exception Handler: Automatically renders Recovery UI only if root failed to mount
      function renderFailSafeRecovery() {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0 || root.getAttribute('data-booting') === 'true')) {
          root.removeAttribute('data-booting');
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;text-align:center;padding:20px;">' +
            '<div style="max-width:380px;background:#ffffff;padding:28px;border-radius:24px;border:1px solid #e2e8f0;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);">' +
              '<div style="font-size:36px;margin-bottom:12px;">⚡</div>' +
              '<h3 style="font-size:20px;font-weight:900;color:#0f172a;margin:0 0 8px 0;letter-spacing:-0.5px;">LOCOHELP</h3>' +
              '<p style="font-size:13px;color:#64748b;margin:0 0 20px 0;line-height:1.5;">Neighborhood network ready. Tap below to refresh session.</p>' +
              '<button onclick="try{if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}}catch(e){} location.reload();" style="width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:14px;box-shadow:0 10px 15px -3px rgba(37,99,235,0.3);">' +
                '🔄 Refresh & Reload App' +
              '</button>' +
            '</div>' +
          '</div>';
        }
      }

      window.addEventListener('error', function(e) {
        var msg = String((e && (e.message || (e.error && e.error.message))) || '');
        if (msg.indexOf('ServiceWorker') !== -1 || msg.indexOf('sw.js') !== -1) {
          e.preventDefault();
          return;
        }
        setTimeout(renderFailSafeRecovery, 200);
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = String((e && e.reason && (e.reason.message || e.reason)) || '');
        if (reasonStr.indexOf('ServiceWorker') !== -1 || reasonStr.indexOf('sw.js') !== -1) {
          e.preventDefault();
          return;
        }
      });
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
    <!-- Animated PWA Startup Splash Screen (Zooming Logo Animation) -->
    <div id="pwa-startup-splash" style="position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);color:#ffffff;font-family:system-ui,-apple-system,sans-serif;pointer-events:none;transition:opacity 0.5s ease-out, visibility 0.5s ease-out;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;">
        <!-- Glowing animated pulse rings -->
        <div style="position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(99,102,241,0.3);animation:splashPulseRing 1.8s infinite cubic-bezier(0.4,0,0.6,1);"></div>
        <div style="position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(168,85,247,0.18);animation:splashPulseRing 1.8s infinite cubic-bezier(0.4,0,0.6,1) 0.4s;"></div>
        
        <!-- Logo container with smooth zoom + fade in -->
        <div style="position:relative;z-index:10;width:90px;height:90px;border-radius:28px;background:linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -10px rgba(99,102,241,0.6);animation:splashZoomIn 1.1s cubic-bezier(0.16,1,0.3,1) forwards;">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
      </div>
      <div style="margin-top:28px;text-align:center;animation:splashFadeUp 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.15s;opacity:0;">
        <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.5px;margin:0;background:linear-gradient(to right, #ffffff, #c7d2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">LOCOHELP</h1>
        <p style="font-size:12px;font-weight:700;color:#94a3b8;margin:6px 0 0 0;letter-spacing:1.5px;text-transform:uppercase;">Neighborhood Network</p>
      </div>
    </div>

    <style>
      @keyframes splashZoomIn {
        0% { transform: scale(0.4); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splashPulseRing {
        0% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
        100% { transform: scale(0.85); opacity: 0.8; }
      }
      @keyframes splashFadeUp {
        0% { transform: translateY(14px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
    </style>

    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('pwa-startup-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 500);
          }
        }, 1200);
      });
    </script>

    <div id="root" data-booting="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
