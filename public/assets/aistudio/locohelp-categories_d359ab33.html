  Poori file ka <style>, <section>, popup aur <script> copy karein.

<style>
  .lh-cats { padding: 4px 0 8px; }

  .lh-cats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);   /* desktop: 5 x 2 */
    gap: 12px;
  }
  @media (max-width: 900px) { .lh-cats-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 640px) { .lh-cats-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
  @media (max-width: 380px) { .lh-cats-grid { grid-template-columns: repeat(2, 1fr); } }

  .lh-cat {
    position: relative;
    aspect-ratio: 1 / 1;                      /* square */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: 18px;
    border: 1px solid var(--bd);
    background: var(--bg);
    color: var(--tx);
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .lh-cat:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px var(--bd); }
  .lh-cat:active { transform: scale(.97); }
  .lh-cat:focus-visible { outline: 3px solid var(--ic); outline-offset: 2px; }

  .lh-cat-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: var(--ic);
    display: grid; place-items: center;
  }
  .lh-cat-icon svg {
    width: 24px; height: 24px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .lh-cat-name {
    font-size: 12.5px;
    font-weight: 800;
    line-height: 1.25;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* count badge (0) - upar right corner */
  .lh-cat-count {
    position: absolute; top: 8px; right: 8px;
    min-width: 22px; padding: 1px 6px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--bd);
    font-size: 11px; font-weight: 800;
    text-align: center;
  }

  /* colours (aapke category page jaise) */
  .c-home    { --ic:#059669; --bg:linear-gradient(135deg,#ecfdf5,#d1fae5); --bd:#6ee7b7; --tx:#064e3b; }
  .c-care    { --ic:#db2777; --bg:linear-gradient(135deg,#fdf2f8,#fce7f3); --bd:#f9a8d4; --tx:#831843; }
  .c-it      { --ic:#4f46e5; --bg:linear-gradient(135deg,#eef2ff,#e0e7ff); --bd:#a5b4fc; --tx:#312e81; }
  .c-biz     { --ic:#2563eb; --bg:linear-gradient(135deg,#eff6ff,#dbeafe); --bd:#93c5fd; --tx:#1e3a8a; }
  .c-broker  { --ic:#0891b2; --bg:linear-gradient(135deg,#ecfeff,#cffafe); --bd:#67e8f9; --tx:#164e63; }
  .c-vehicle { --ic:#ea580c; --bg:linear-gradient(135deg,#fff7ed,#ffedd5); --bd:#fdba74; --tx:#7c2d12; }
  .c-edu     { --ic:#7c3aed; --bg:linear-gradient(135deg,#f5f3ff,#ede9fe); --bd:#c4b5fd; --tx:#4c1d95; }
  .c-sports  { --ic:#d97706; --bg:linear-gradient(135deg,#fffbeb,#fef3c7); --bd:#fcd34d; --tx:#78350f; }
  .c-social  { --ic:#e11d48; --bg:linear-gradient(135deg,#fff1f2,#ffe4e6); --bd:#fda4af; --tx:#881337; }
  .c-other   { --ic:#0d9488; --bg:linear-gradient(135deg,#f0fdfa,#ccfbf1); --bd:#5eead4; --tx:#134e4a; }

  /* ---------- Popup (modal) ---------- */
  .lh-modal {
    position: fixed; inset: 0; z-index: 9999;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, .55);
  }
  .lh-modal.open { display: flex; }

  .lh-modal-panel {
    width: 100%; max-width: 720px; max-height: 88vh;
    display: flex; flex-direction: column;
    background: #fff; border-radius: 22px;
    border: 1px solid var(--bd);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.45);
    overflow: hidden;
    animation: lhPop .18s ease-out;
  }
  @keyframes lhPop { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .lh-modal-panel { animation: none; } }

  .lh-modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--bg); color: var(--tx);
    border-bottom: 1px solid var(--bd);
  }
  .lh-modal-head .lh-cat-icon { flex: none; }
  .lh-modal-title { flex: 1; font-size: 16px; font-weight: 800; line-height: 1.25; margin: 0; }
  .lh-modal-close {
    flex: none; width: 36px; height: 36px; border-radius: 12px;
    border: 1px solid var(--bd); background: #fff; color: var(--tx);
    display: grid; place-items: center; cursor: pointer;
  }
  .lh-modal-close:focus-visible { outline: 3px solid var(--ic); outline-offset: 2px; }
  .lh-modal-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

  .lh-sub-list {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 14px 16px 18px; overflow-y: auto;
    background: #fff;
  }
  @media (max-width: 560px) {
    .lh-modal { align-items: flex-end; padding: 0; }
    .lh-modal-panel { max-width: none; border-radius: 22px 22px 0 0; max-height: 85vh; }
    .lh-sub-list { grid-template-columns: 1fr; }
  }

  .lh-sub {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--bd); background: var(--bg); color: var(--tx);
    font: inherit; font-size: 13px; font-weight: 700; text-align: left;
    cursor: pointer; transition: transform .12s ease;
  }
  .lh-sub:hover { transform: translateY(-1px); }
  .lh-sub:focus-visible { outline: 3px solid var(--ic); outline-offset: 2px; }
  .lh-sub-ic {
    flex: none; width: 32px; height: 32px; border-radius: 10px;
    background: #fff; border: 1px solid var(--bd);
    display: grid; place-items: center;
  }
  .lh-sub-ic svg { width: 17px; height: 17px; stroke: var(--ic); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lh-sub-name { flex: 1; line-height: 1.25; }
  .lh-sub .lh-cat-count { position: static; }
  .lh-sub-arrow { flex: none; width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
</style>

     SETUP 1: Bhasha kaise pata chale
     Neeche getLang() in jagah dekhta hai (is order me):
       1. window.currentLang
       2. localStorage ki keys: lang, language, selectedLanguage, locohelp_lang, i18nextLng
       3. <html lang="...">
     Agar aapki website alag jagah bhasha rakhti hai, to sirf getLang() badal dein.
     Bhasha badalne par categories apne aap badal jaati hain (har 0.4 sec check hota hai),
     ya seedha ye chala sakte hain:  LocoCategories.setLang('hi')   // 'en' | 'hi' | 'gu'
     ===================================================== */
  var LANG_KEYS = ['lang', 'language', 'selectedLanguage', 'locohelp_lang', 'i18nextLng'];

  function normalize(v) {
    v = String(v || '').toLowerCase();
    if (v.indexOf('hi') === 0 || v.indexOf('hindi') > -1 || v.indexOf('हिं') > -1) return 'hi';
    if (v.indexOf('gu') === 0 || v.indexOf('gujarati') > -1 || v.indexOf('ગુજ') > -1) return 'gu';
    return 'en';
  }
  function getLang() {
    if (window.currentLang) return normalize(window.currentLang);
    try {
      for (var i = 0; i < LANG_KEYS.length; i++) {
        var v = localStorage.getItem(LANG_KEYS[i]);
        if (v) return normalize(v);
      }
    } catch (e) {}
    return normalize(document.documentElement.lang);
  }

  /* ===== neeche ka code badalne ki zaroorat nahi ===== */
  var IDX = { en: 0, hi: 1, gu: 2 };
  var CHEVRON = '<svg class="lh-sub-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
  var DOT_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>';

  var grid = document.getElementById('lhGrid');
  var modal = document.getElementById('lhModal');
  var panel = document.getElementById('lhPanel');
  var list  = document.getElementById('lhSubList');
  var title = document.getElementById('lhModalTitle');
  var icon  = document.getElementById('lhModalIcon');
  var closeBtn = document.getElementById('lhModalClose');

  var lang = getLang();
  var openKey = null;

  function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function svg(inner) { return '<svg viewBox="0 0 24 24">' + inner + '</svg>'; }
  function find(key) { return CATS.filter(function (c) { return c.key === key; })[0]; }

  function renderGrid() {
    var i = IDX[lang];
    grid.innerHTML = CATS.map(function (c) {
      return '<a class="lh-cat ' + c.cls + '" href="#" data-cat="' + c.key + '">' +
               '<span class="lh-cat-count" data-count="' + c.key + '">0</span>' +
               '<span class="lh-cat-icon">' + svg(c.icon) + '</span>' +
               '<span class="lh-cat-name">' + esc(c.name[i]) + '</span>' +
             '</a>';
    }).join('');
  }

  function renderModal() {
    var c = find(openKey), i = IDX[lang];
    if (!c) return;
    title.textContent = c.name[i];
    icon.innerHTML = svg(c.icon);
    list.innerHTML = c.subs.map(function (s, n) {
      return '<button type="button" class="lh-sub" data-cat="' + c.key + '" data-index="' + n + '">' +
               '<span class="lh-sub-ic">' + DOT_ICON + '</span>' +
               '<span class="lh-sub-name">' + esc(s[i]) + '</span>' +
               '<span class="lh-cat-count">0</span>' + CHEVRON +
             '</button>';
    }).join('');
  }

  function openModal(key) {
    var c = find(key);
    if (!c) return;
    openKey = key;
    panel.className = 'lh-modal-panel ' + c.cls;
    renderModal();
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    var card = openKey && grid.querySelector('[data-cat="' + openKey + '"]');
    if (card) card.focus();
    openKey = null;
  }

  function setLang(code) {
    code = normalize(code);
    if (code === lang) return;
    lang = code;
    renderGrid();
    if (openKey) renderModal();
  }

  // card click -> popup
  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.lh-cat');
    if (!card) return;
    e.preventDefault();
    openModal(card.dataset.cat);
  });

  // subcategory click
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('.lh-sub');
    if (!btn) return;
    var c = find(btn.dataset.cat);
    var s = c.subs[Number(btn.dataset.index)];
    // TODO: yahan apna function lagayein, jaise: openExperts(c.key, s[0]);
    // s[0] = English naam (database/filter ke liye best), s[IDX[lang]] = dikhne wala naam
    console.log('Subcategory clicked:', c.key, '>', s[0]);
    // closeModal();   // agar click ke baad popup band karna ho
  });

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // bhasha badalne par categories bhi badlein
  setInterval(function () { setLang(getLang()); }, 400);
  window.addEventListener('storage', function () { setLang(getLang()); });

  renderGrid();

  // bahar se istemaal ke liye
  window.LocoCategories = {
    setLang: setLang,
    setCount: function (key, n, subIndex) {
      var el = (subIndex == null)
        ? grid.querySelector('[data-count="' + key + '"]')
        : list.querySelectorAll('.lh-sub .lh-cat-count')[subIndex];
      if (el) el.textContent = n;
    }
  };
})();
</script>
